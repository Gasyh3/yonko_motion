    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Orbite — trame de fond</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05060c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060c;
      }
      #space {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-no-timeline="" data-start="0" data-duration="46" data-width="1920" data-height="1080">
      <canvas id="space" class="clip" data-layout-allow-overflow="" data-start="0" data-duration="46" data-track-index="0"></canvas>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three.module.min.js"
        }
      }
    </script>
    <script type="text/hf-after-fonts+module">
      import * as THREE from "three";

      // ───────────────────────── Canvas & timing ─────────────────────────
      const W = 1920;
      const H = 1080;

      // Each section: transit (fast flight) then hold (slow move, site content shows).
      // Kept in sync with sections.json.
      const SECTIONS = [
        { id: "hero", transit: null, hold: [0, 10] },
        { id: "station", transit: [10, 12], hold: [12, 16] },
        { id: "gas-giant", transit: [16, 18], hold: [18, 22] },
        { id: "belt", transit: [22, 24], hold: [24, 28] },
        { id: "solar", transit: [28, 30], hold: [30, 34] },
        { id: "red-planet", transit: [34, 36], hold: [36, 40] },
        { id: "eclipse", transit: [40, 42], hold: [42, 46] },
      ];

      // ───────────────────────── Deterministic helpers ─────────────────────────
      function mulberry32(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) >>> 0;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const lerp = (a, b, t) => a + (b - a) * t;
      const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const easeOutQuad = (x) => 1 - (1 - x) * (1 - x);
      const smooth = (x) => x * x * (3 - 2 * x);
      const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

      // Small 3D value noise for CPU-side geometry deformation.
      function hash3(x, y, z, seed) {
        let h = (x * 374761393 + y * 668265263 + z * 2147483647 + seed * 144269504) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }
      function vnoise(x, y, z, seed) {
        const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        const xf = smooth(x - xi), yf = smooth(y - yi), zf = smooth(z - zi);
        let out = 0;
        for (let dz = 0; dz < 2; dz++)
          for (let dy = 0; dy < 2; dy++)
            for (let dx = 0; dx < 2; dx++) {
              const w = (dx ? xf : 1 - xf) * (dy ? yf : 1 - yf) * (dz ? zf : 1 - zf);
              out += w * hash3(xi + dx, yi + dy, zi + dz, seed);
            }
        return out;
      }

      // ───────────────────────── Renderer, scene, camera ─────────────────────────
      const canvas = document.getElementById("space");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x05060c, 1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, W / H, 5, 600000);

      // One sun for the whole system, always from the same side of the universe.
      const SUN_DIR = v3(0.22, 0.1, -1).normalize();
      const SUN_DIST = 300000;

      const sunLight = new THREE.DirectionalLight(0xfff1de, 3.2);
      sunLight.position.copy(SUN_DIR);
      scene.add(sunLight);
      scene.add(sunLight.target);
      scene.add(new THREE.HemisphereLight(0x5a6c9c, 0x0b0c14, 0.35));

      // ───────────────────────── GLSL noise ─────────────────────────
      const NOISE = /* glsl */ `
        vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
        vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
        vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
        vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
        float snoise(vec3 v){
          const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
          vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
          vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
          vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
          i=mod289(i);
          vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
          float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
          vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
          vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
          vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
          vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
          vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
          vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
          vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
          p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
          vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
          return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
        }
        float fbm(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<6;i++){ s+=a*snoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
        float fbm3(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<3;i++){ s+=a*snoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
        float hash13(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
      `;

      // ───────────────────────── Planets ─────────────────────────
      // mode 0 ocean · 1 gas giant · 2 ice · 3 desert (red) · 4 grey moon · 5 dark eclipse body
      const planetVert = /* glsl */ `
        varying vec3 vObj; varying vec3 vN; varying vec3 vW;
        void main(){
          vObj = normalize(position);
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz;
          gl_Position = projectionMatrix * viewMatrix * w;
        }`;
      const planetFrag = /* glsl */ `
        uniform vec3 uSun; uniform int uMode; uniform float uTime; uniform vec3 uSeed;
        uniform vec3 uC0; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3; uniform float uFade;
        varying vec3 vObj; varying vec3 vN; varying vec3 vW;
        ${NOISE}
        void main(){
          vec3 N = normalize(vN); vec3 L = normalize(uSun); vec3 V = normalize(cameraPosition - vW);
          float ndl = dot(N, L);
          float day = smoothstep(-0.08, 0.35, ndl);
          vec3 p = vObj + uSeed;
          vec3 col = vec3(0.0); float spec = 0.0; vec3 night = vec3(0.0);
          if (uMode == 0) {
            float h = fbm(p * 1.7);
            float land = smoothstep(0.13, 0.17, h);
            float veg = fbm3(p * 4.0 + 3.0);
            vec3 ocean = mix(uC0, uC1, smoothstep(-0.35, 0.14, h));
            vec3 ground = mix(uC2, uC3, smoothstep(-0.2, 0.3, veg));
            ground *= 0.8 + 0.4 * fbm3(p * 14.0);
            col = mix(ocean, ground, land);
            float ice = smoothstep(0.78, 0.86, abs(vObj.y) + 0.05 * fbm3(p * 6.0));
            col = mix(col, vec3(0.92, 0.95, 0.98), ice);
            vec3 Hh = normalize(L + V);
            spec = (1.0 - land) * (1.0 - ice) * pow(max(dot(N, Hh), 0.0), 60.0) * 0.9;
            float cl = fbm(p * 2.6 + vec3(uTime * 0.004, 0.0, uTime * 0.002) + fbm3(p * 1.3) * 0.6);
            float clouds = smoothstep(0.02, 0.5, cl);
            col = mix(col, vec3(0.96, 0.97, 1.0), clouds * 0.9);
            spec *= (1.0 - clouds);
            float cityN = smoothstep(0.82, 0.95, hash13(floor(vObj * 420.0))) * smoothstep(0.0, 0.3, fbm3(p * 9.0));
            night = vec3(1.0, 0.68, 0.36) * cityN * land * (1.0 - clouds) * 0.0;
          } else if (uMode == 1) {
            float warp = fbm(p * vec3(1.6, 1.6, 5.0) + vec3(uTime * 0.01, 0.0, 0.0));
            float b = vObj.z * 7.5 + warp * 0.55;
            float v1 = 0.5 + 0.5 * sin(b * 3.3 + sin(b * 1.7) * 1.6);
            float v2 = 0.5 + 0.5 * sin(b * 9.1 + 1.3);
            col = mix(uC0, uC1, v1);
            col = mix(col, uC2, smoothstep(0.55, 1.0, v2) * 0.55);
            col = mix(col, uC3, smoothstep(0.6, 0.95, 0.5 + 0.5 * sin(b * 0.8 + 2.0)) * 0.5);
            col *= 0.86 + 0.24 * fbm3(p * vec3(3.0, 3.0, 26.0));
            vec3 sp = vObj - normalize(vec3(0.55, 0.77, -0.32));
            float storm = smoothstep(0.16, 0.0, length(sp * vec3(1.0, 1.0, 1.9)) + 0.03 * fbm3(p * 9.0));
            col = mix(col, uC3 * 0.85, storm * 0.8);
          } else if (uMode == 2) {
            float f = fbm(p * 2.2);
            float cracks = 1.0 - smoothstep(0.0, 0.04, abs(fbm3(p * 5.0)));
            col = mix(uC0, uC1, smoothstep(-0.4, 0.5, f));
            col = mix(col, uC2, cracks * 0.7);
          } else if (uMode == 3) {
            float f = fbm(p * 2.0);
            col = mix(uC0, uC1, smoothstep(-0.35, 0.35, f));
            col = mix(col, uC2, smoothstep(0.15, 0.6, fbm3(p * 5.0 + 7.0)) * 0.6);
            float cr = fbm3(p * 9.0);
            col *= 0.85 + 0.3 * smoothstep(-0.2, 0.3, cr);
            float craterMask = smoothstep(0.55, 0.62, 0.5 + 0.5 * snoise(p * 6.0)) * 0.35;
            col = mix(col, uC3, craterMask);
            float cap = smoothstep(0.86, 0.92, vObj.y + 0.04 * fbm3(p * 7.0));
            col = mix(col, vec3(0.95, 0.9, 0.86), cap);
          } else if (uMode == 4) {
            float f = fbm(p * 3.0);
            col = mix(uC0, uC1, smoothstep(-0.4, 0.4, f));
            col *= 0.75 + 0.45 * smoothstep(0.3, 0.7, 0.5 + 0.5 * snoise(p * 11.0));
          } else {
            col = uC0 * (0.8 + 0.3 * fbm3(p * 3.0));
          }
          float wrap = smoothstep(-0.12, 1.0, ndl);
          vec3 lit = col * (wrap * 1.15 * day + 0.012) + spec * vec3(1.0, 0.95, 0.85);
          lit += night * (1.0 - day);
          gl_FragColor = vec4(lit, uFade);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`;

      const atmoFrag = /* glsl */ `
        uniform vec3 uSun; uniform vec3 uColor; uniform float uPower; uniform float uFwd; uniform float uFade;
        varying vec3 vN; varying vec3 vW;
        void main(){
          vec3 N = normalize(vN); vec3 V = normalize(cameraPosition - vW); vec3 L = normalize(uSun);
          float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), uPower);
          float day = smoothstep(-0.35, 0.45, dot(N, L));
          float fwd = pow(max(dot(-V, L), 0.0), 5.0);
          vec3 c = uColor * fres * (day * 1.1 + fwd * uFwd) * uFade;
          gl_FragColor = vec4(c, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`;
      const atmoVert = /* glsl */ `
        varying vec3 vN; varying vec3 vW;
        void main(){
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz;
          gl_Position = projectionMatrix * viewMatrix * w;
        }`;

      const allUniformSets = [];
      function makePlanet({ radius, mode, colors, seed, atmo, detail = 128 }) {
        const group = new THREE.Group();
        const uniforms = {
          uSun: { value: SUN_DIR },
          uMode: { value: mode },
          uTime: { value: 0 },
          uSeed: { value: new THREE.Vector3(seed, seed * 1.7, seed * 0.3) },
          uC0: { value: new THREE.Color(colors[0]) },
          uC1: { value: new THREE.Color(colors[1] || colors[0]) },
          uC2: { value: new THREE.Color(colors[2] || colors[0]) },
          uC3: { value: new THREE.Color(colors[3] || colors[0]) },
          uFade: { value: 1 },
        };
        allUniformSets.push(uniforms);
        const body = new THREE.Mesh(
          new THREE.SphereGeometry(radius, detail, Math.round(detail * 0.75)),
          new THREE.ShaderMaterial({ uniforms, vertexShader: planetVert, fragmentShader: planetFrag, transparent: true }),
        );
        group.add(body);
        if (atmo) {
          const shell = new THREE.Mesh(
            new THREE.SphereGeometry(radius * atmo.scale, detail, Math.round(detail * 0.75)),
            new THREE.ShaderMaterial({
              uniforms: {
                uSun: { value: SUN_DIR },
                uColor: { value: new THREE.Color(atmo.color) },
                uPower: { value: atmo.power },
                uFwd: { value: atmo.fwd },
                uFade: uniforms.uFade,
              },
              vertexShader: atmoVert,
              fragmentShader: atmoFrag,
              transparent: true,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
            }),
          );
          group.add(shell);
        }
        group.userData = { body, uniforms, radius };
        return group;
      }

      // ───────────────────────── Sun ─────────────────────────
      const sun = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.ShaderMaterial({
          uniforms: { uFlare: { value: 1 } },
          vertexShader: /* glsl */ `varying vec2 vUv; void main(){ vUv = uv*2.0-1.0; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
          fragmentShader: /* glsl */ `
            uniform float uFlare; varying vec2 vUv;
            void main(){
              float r = length(vUv);
              float core = smoothstep(0.024, 0.016, r) * 14.0;
              float glow = exp(-r * 26.0) * 2.2 + exp(-r * 9.0) * 0.35 + exp(-r * 3.5) * 0.04;
              float streak = exp(-abs(vUv.y) * 160.0) * exp(-abs(vUv.x) * 3.0) * 0.55 * uFlare;
              vec3 c = vec3(1.0, 0.9, 0.76) * (core + glow + streak);
              c *= smoothstep(1.0, 0.85, r);
              gl_FragColor = vec4(c, 1.0);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }`,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        }),
      );
      sun.renderOrder = -2;
      sun.scale.setScalar(SUN_DIST * 1.1);
      scene.add(sun);

      // ───────────────────────── Sky: stars + galactic haze ─────────────────────────
      const STAR_R = 200000;
      {
        const rnd = mulberry32(7);
        const N = 14000;
        const dir = new Float32Array(N * 3);
        const size = new Float32Array(N);
        const col = new Float32Array(N * 3);
        const phase = new Float32Array(N);
        const bandN = v3(0.35, 0.82, 0.45).normalize();
        const tmp = new THREE.Vector3();
        const palette = [
          new THREE.Color("#fff4e6"),
          new THREE.Color("#ffe1b8"),
          new THREE.Color("#d9e4ff"),
          new THREE.Color("#ffffff"),
          new THREE.Color("#ffd2a1"),
        ];
        for (let i = 0; i < N; i++) {
          let ok = false;
          while (!ok) {
            tmp.set(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1);
            const l = tmp.length();
            if (l < 0.05 || l > 1) continue;
            tmp.divideScalar(l);
            // denser along the galactic band
            const d = Math.abs(tmp.dot(bandN));
            ok = i % 3 !== 0 || rnd() < Math.exp(-(d * d) / 0.02);
          }
          dir.set([tmp.x, tmp.y, tmp.z], i * 3);
          const m = Math.pow(rnd(), 6);
          size[i] = 1.1 + m * 3.6;
          const c = palette[Math.floor(rnd() * palette.length)];
          const b = 0.35 + 0.65 * Math.pow(rnd(), 1.5) + m * 0.8;
          col.set([c.r * b, c.g * b, c.b * b], i * 3);
          phase[i] = rnd() * 6.283;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(dir, 3));
        g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
        g.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
        g.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
        const starsMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uR: { value: STAR_R } },
          vertexShader: /* glsl */ `
            uniform float uTime; uniform float uR;
            attribute float aSize; attribute vec3 aColor; attribute float aPhase;
            varying vec3 vC;
            void main(){
              vec3 wp = cameraPosition + position * uR;
              gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
              float tw = 0.85 + 0.15 * sin(uTime * (1.3 + fract(aPhase) * 2.0) + aPhase);
              vC = aColor * tw;
              gl_PointSize = aSize;
            }`,
          fragmentShader: /* glsl */ `
            varying vec3 vC;
            void main(){
              vec2 d = gl_PointCoord - 0.5; float r = length(d);
              float a = smoothstep(0.5, 0.0, r);
              gl_FragColor = vec4(vC * a, 1.0);
              #include <colorspace_fragment>
            }`,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const stars = new THREE.Points(g, starsMat);
        stars.frustumCulled = false;
        stars.renderOrder = -3;
        scene.add(stars);
        allUniformSets.push(starsMat.uniforms);

        // galactic haze on a camera-centred sphere
        const haze = new THREE.Mesh(
          new THREE.SphereGeometry(1, 64, 32),
          new THREE.ShaderMaterial({
            uniforms: { uBand: { value: bandN }, uR: { value: STAR_R * 1.05 } },
            vertexShader: /* glsl */ `
              uniform float uR; varying vec3 vD;
              void main(){ vD = position; vec3 wp = cameraPosition + position * uR; gl_Position = projectionMatrix * viewMatrix * vec4(wp,1.0); }`,
            fragmentShader: /* glsl */ `
              uniform vec3 uBand; varying vec3 vD;
              ${NOISE}
              void main(){
                vec3 d = normalize(vD);
                float x = dot(d, uBand);
                float band = exp(-x * x / 0.035);
                float n = fbm(d * 3.2) * 0.5 + 0.5;
                float lanes = smoothstep(0.35, 0.65, fbm3(d * 7.0 + 4.0) * 0.5 + 0.5);
                vec3 c = mix(vec3(0.18, 0.22, 0.42), vec3(0.55, 0.45, 0.36), n) * band * (0.35 + 0.65 * n) * (1.0 - 0.55 * lanes);
                c *= 0.03;
                c += vec3(0.0022, 0.0028, 0.0065) * (0.6 + 0.4 * n);
                c += (hash13(gl_FragCoord.xyy) - 0.5) / 255.0;
                gl_FragColor = vec4(c, 1.0);
                #include <colorspace_fragment>
              }`,
            side: THREE.BackSide,

      // ───────────────────────── Stop 1 · ocean planet (hero) ─────────────────────────

      const HERO_FWD = SUN_DIR.clone().cross(v3(0, 1, 0)).normalize().lerp(SUN_DIR, 0.22).normalize();

      // ───────────────────────── Stop 2 · ring station ─────────────────────────
      const P2 = v3(-1800, 1400, -26000);

      station.position.copy(P2);
      {
        const az = 142 * (Math.PI / 180), el = 10 * (Math.PI / 180);

      scene.add(station);

      // ───────────────────────── Stop 3 · ringed gas giant ─────────────────────────
      const P3 = v3(-16000, -2500, -52000);
      const giant = makePlanet({
        radius: 5200,
        mode: 1,
        seed: 1.4,
        colors: ["#d9a35a", "#9c6332", "#f2dcb0", "#7c3f1c"],

      scene.add(giant);

      // ───────────────────────── Stop 4 · asteroid belt + ice moon ─────────────────────────
      const P4 = v3(6000, 800, -76000);
      const iceMoon = makePlanet({
        radius: 1700,
        mode: 2,
        seed: 5.2,
        colors: ["#9fc6df", "#eef8ff", "#4f7ea3"],

      scene.add(iceMoon);

      const BELT_CENTER = P4.clone();
      const BELT_FWD = v3(1, 0, 0.45).normalize();
      const BELT_RIGHT = BELT_FWD.clone().cross(v3(0, 1, 0)).normalize();
      const beltLocal = (x, y, z) => BELT_CENTER.clone()
        .add(BELT_RIGHT.clone().multiplyScalar(x))
        .add(v3(0, y, 0))
        .add(BELT_FWD.clone().multiplyScalar(-z));
      iceMoon.position.copy(P4).add(BELT_FWD.clone().multiplyScalar(9000)).add(BELT_RIGHT.clone().multiplyScalar(6200)).add(v3(0, 1500, 0));
      const rocks = [];
      {
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x6f675c, roughness: 0.95, metalness: 0.05, flatShading: true });
        const rnd = mulberry32(44);
        const variants = 4;
        const per = 70;

          const geo = new THREE.IcosahedronGeometry(1, 3);
          const pos = geo.attributes.position;
          const tmp = new THREE.Vector3();
          for (let i = 0; i < pos.count; i++) {

              y = (rnd() * 2 - 1) * (depth < 0.4 ? 1100 : 2600);
              s = depth < 0.4 ? 25 + Math.pow(rnd(), 2) * 110 : 40 + Math.pow(rnd(), 3) * 380;

      const _m = new THREE.Matrix4();

      // ───────────────────────── Stop 5 · solar station + nebula ─────────────────────────

      // nebula: soft additive veils far behind the solar station

          fragmentShader: /* glsl */ `

      corona.position.copy(P7).add(SUN_DIR.clone().multiplyScalar(5000));

      scene.add(corona);

      // ───────────────────────── Near dust (parallax during flights) ─────────────────────────
      let dust;
      function buildDust(samplePath) {
        const rnd = mulberry32(99);

        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3));

            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        dust.frustumCulled = false;
        scene.add(dust);
      }

      // ───────────────────────── Shots ─────────────────────────
      // A shot maps hold progress u ∈ [0,1] to camera pos, target, roll (rad) and lens
      // shift (sx, sy in NDC: +sx pushes the subject to the right of frame).
      function orbit(center, o) {
        return (u) => {
          const e = o.ease ? o.ease(u) : u;
          const az = lerp(o.az[0], o.az[1], e);
          const el = lerp(o.el[0], o.el[1], e);
          const d = lerp(o.d[0], o.d[1], e);
          const off = v3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(d);
          const c = typeof center === "function" ? center(u) : center;
          return {
            pos: c.clone().add(off),
            target: c.clone().add(o.aim ? o.aim(u) : v3(0, 0, 0)),
            roll: lerp(o.roll?.[0] ?? 0, o.roll?.[1] ?? 0, e),
            sx: o.sx,
            sy: o.sy,
          };
        };
      }
      const deg = Math.PI / 180;

      // Hero: crane up over the ocean planet's limb, the sun clears the horizon.
      const heroCam0 = v3(0, 0, 0);
      const shotHero = (u) => {
        const e = smooth(u) * 0.35 + u * 0.65;
        const pos = heroCam0.clone().add(HERO_UP.clone().multiplyScalar(1100 * e)).add(HERO_FWD.clone().multiplyScalar(500 * e));
        const look = pos.clone().add(HERO_FWD.clone().multiplyScalar(10000)).add(HERO_UP.clone().multiplyScalar(-600 * e));
        return { pos, target: look, roll: lerp(-3, 1, e) * deg, sx: 0.0, sy: 0.0 };
      };

      const shots = [
        shotHero,
        // Station: orbital arc around the wheel (station right, text left).
        orbit(P2, { az: [128 * deg, 156 * deg], el: [14 * deg, 7 * deg], d: [1500, 1380], roll: [-4 * deg, 3 * deg], sx: 0.46, sy: -0.04 }),
        // Gas giant: dive under the ring plane with a bank (planet left, text right).
        orbit(P3, { az: [118 * deg, 124 * deg], el: [9 * deg, -3 * deg], d: [24000, 22500], roll: [4 * deg, -10 * deg], sx: -0.52, sy: -0.04 }),
        // Belt: lateral truck through the rocks (moon right, text left).
        (u) => {
          const pos = beltLocal(lerp(-1300, 1300, u), lerp(-80, 120, u), 2200);
          const target = pos.clone().add(BELT_FWD.clone().multiplyScalar(9000)).add(BELT_RIGHT.clone().multiplyScalar(1400)).add(v3(0, 250, 0));
          return { pos, target, roll: lerp(2, -2, u) * deg, sx: 0.0, sy: 0.0 };
        },
        // Solar station: low-angle dolly along the beam (structure low, text top).
        (u) => {
          const along = v3(1, 0, 0).applyEuler(solar.rotation);
          const pos = P5.clone().add(along.clone().multiplyScalar(lerp(-1600, 0, u))).add(SUN_DIR.clone().multiplyScalar(1700)).add(v3(0, -650, 0));
          const target = pos.clone().add(along.clone().multiplyScalar(1700)).add(SUN_DIR.clone().multiplyScalar(-1700)).add(v3(0, 1000, 0));
          return { pos, target, roll: lerp(-6, -3, u) * deg, sx: 0.0, sy: -0.32 };
        },
        // Red planet: slowing push-in, the moon passes in front (planet left-low, text right).
        orbit(P6, {
          az: [-122 * deg, -114 * deg],
          el: [10 * deg, 7 * deg],
          d: [17500, 13800],
          ease: easeOutQuad,
          roll: [-3 * deg, 0],
          sx: -0.5,
          sy: -0.22,
        }),
        // Eclipse: settle onto the sun axis, the ring of light closes.
        (u) => {
          const e = easeOutQuad(u);
          const back = SUN_DIR.clone().multiplyScalar(-lerp(14500, 13200, e));
          const miss = v3(lerp(1400, 0, e), lerp(-900, 0, e), 0);
          const pos = P7.clone().add(back).add(miss);
          return { pos, target: P7.clone().add(v3(0, 0, 0)), roll: lerp(3, 0, e) * deg, sx: 0.0, sy: 0.28 };
        },
      ];

      // Moon orbit around the red planet: crosses in front of it during its hold.
      let moonA, moonB;
      function moonPos(t) {
        if (!moonA) {
          const end = shots[5](1);
          const fwd = P6.clone().sub(end.pos);
          const dist = fwd.length();
          fwd.normalize();
          const right = fwd.clone().cross(v3(0, 1, 0)).normalize();
          const up = right.clone().cross(fwd).normalize();
          moonB = end.pos.clone().add(fwd.clone().multiplyScalar(dist * 0.42)).add(right.clone().multiplyScalar(dist * 0.42 * 0.2)).add(up.clone().multiplyScalar(dist * 0.42 * 0.12));
          moonA = moonB.clone().add(right.clone().multiplyScalar(2600)).add(up.clone().multiplyScalar(700)).add(fwd.clone().multiplyScalar(-600));
        }
        return moonA.clone().lerp(moonB, smooth(clamp01((t - 33) / 9.5)));
      }
      function moonPosOld(t) {
        const a = lerp(-0.9, 0.25, clamp01((t - 33) / 9));
        const r = 6400;
        return P6.clone().add(v3(-Math.sin(a) * r * 0.9 - 2600, 2200 + Math.sin(a) * 600, Math.cos(a) * r * 0.6 + 4200));
      }

      // ───────────────────────── Camera solve ─────────────────────────
      const tmpM = new THREE.Matrix4();
      const UP = v3(0, 1, 0);
      function quatFor(s) {
        tmpM.lookAt(s.pos, s.target, UP);
        const q = new THREE.Quaternion().setFromRotationMatrix(tmpM);
        const rollQ = new THREE.Quaternion().setFromAxisAngle(v3(0, 0, 1), s.roll || 0);
        return q.multiply(rollQ);
      }
      function forwardOf(s) {
        return s.target.clone().sub(s.pos).normalize();
      }
      function cubic(p0, c0, c1, p1, s) {
        const a = 1 - s;
        return p0.clone().multiplyScalar(a * a * a)
          .add(c0.clone().multiplyScalar(3 * a * a * s))
          .add(c1.clone().multiplyScalar(3 * a * s * s))
          .add(p1.clone().multiplyScalar(s * s * s));
      }

      function solve(t) {
        for (let i = 0; i < SECTIONS.length; i++) {
          const sec = SECTIONS[i];
          const [h0, h1] = sec.hold;
          if (sec.transit && t < sec.transit[1]) {
            const [t0, t1] = sec.transit;
            const s = easeInOutCubic(clamp01((t - t0) / (t1 - t0)));
            const a = shots[i - 1](1);
            const b = shots[i](0);
            const dist = a.pos.distanceTo(b.pos);
            const c0 = a.pos.clone().add(forwardOf(a).multiplyScalar(dist * 0.32));
            const c1 = b.pos.clone().sub(forwardOf(b).multiplyScalar(dist * 0.32));
            const pos = cubic(a.pos, c0, c1, b.pos, s);
            const qa = quatFor(a);
            const qb = quatFor(b);
            const q = qa.clone().slerp(qb, smooth(clamp01(s * 1.15)));
            return { pos, quat: q, sx: lerp(a.sx, b.sx, s), sy: lerp(a.sy, b.sy, s) };
          }
          if (t <= h1 || i === SECTIONS.length - 1) {
            const s = shots[i](clamp01((t - h0) / (h1 - h0)));
            return { pos: s.pos, quat: quatFor(s), sx: s.sx, sy: s.sy };
          }
        }
      }

      {
        const s0 = shots[4](0.5);
        const fwd = s0.target.clone().sub(s0.pos).normalize();
        const right = fwd.clone().cross(v3(0, 1, 0)).normalize();
        const up = right.clone().cross(fwd).normalize();
        const base = s0.pos.clone().add(fwd.multiplyScalar(70000));
        const offs = [[0.0, 0.42], [-0.55, 0.62], [0.6, 0.25]];
        nebulae.forEach((n, i) => {
          n.position.copy(base).add(right.clone().multiplyScalar(offs[i][0] * 70000)).add(up.clone().multiplyScalar(offs[i][1] * 70000));
        });
      }

      buildDust((t) => solve(t).pos);

      // ───────────────────────── Visibility windows ─────────────────────────
      function windowFade(t, a, b) {
        return smooth(clamp01((t - a) / 1.2)) * smooth(clamp01((b - t) / 1.2));
      }
      const fadeMats = new Map();
      function fadeGroup(obj, f) {
        obj.visible = f > 0.001;
        if (!fadeMats.has(obj)) {
          const mats = new Set();
          obj.traverse((o) => {
            if (o.material && !o.material.isShaderMaterial) mats.add(o.material);
          });
          for (const m of mats) m.transparent = true;
          fadeMats.set(obj, [...mats]);
        }
        for (const m of fadeMats.get(obj)) m.opacity = f;
      }

      // ───────────────────────── Render ─────────────────────────
      function renderAt(time) {
        const t = Math.min(46, Math.max(0, time));
        const cam = solve(t);
        camera.position.copy(cam.pos);
        camera.quaternion.copy(cam.quat);
        camera.updateProjectionMatrix();
        camera.projectionMatrix.elements[8] = -cam.sx;
        camera.projectionMatrix.elements[9] = -cam.sy;
        camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
        camera.updateMatrixWorld(true);

        for (const u of allUniformSets) if (u.uTime) u.uTime.value = t;

        sun.position.copy(camera.position).add(SUN_DIR.clone().multiplyScalar(SUN_DIST));
        sun.quaternion.copy(camera.quaternion);
        const facing = camera.getWorldDirection(new THREE.Vector3()).dot(SUN_DIR);
        sun.material.uniforms.uFlare.value = THREE.MathUtils.smoothstep(facing, 0.8, 0.92);

        ocean.userData.body.rotation.y = t * 0.006;
        stationSpin.rotation.z = -t * 0.22;
        giant.userData.body.rotation.y = t * 0.012;
        iceMoon.userData.body.rotation.y = t * 0.01;
        red.userData.body.rotation.y = 0.8 + t * 0.008;
        moon.position.copy(moonPos(t));
        moon.userData.body.rotation.y = t * 0.02;
        updateRocks(t);
        for (const b of beacons) {
          const k = (t * 0.9 + b.phase) % 1;
          b.mesh.scale.setScalar(k < 0.12 ? 1.6 : 0.6);
        }
        for (const n of nebulae) n.lookAt(camera.position);

        // Each stop exists only around its own section, so no destination clutters
        // another section's frame. Planets fade; hard-surface objects fade by opacity.
        const fadeP = (obj, a, b) => {
          const f = windowFade(t, a, b);
          obj.visible = f > 0.001;
          obj.userData.uniforms.uFade.value = f;
        };
        fadeP(ocean, -1, 12.5);
        fadeP(giant, 15.2, 24.8);
        fadeP(iceMoon, 21.2, 30.8);
        fadeP(red, 33.2, 42.8);
        fadeP(moon, 33.2, 42.8);
        fadeP(dark, 39.2, 47);
        corona.material.uniforms.uFade.value = windowFade(t, 39.2, 47);
        corona.visible = corona.material.uniforms.uFade.value > 0.001;
        corona.quaternion.copy(camera.quaternion);
        fadeGroup(station, windowFade(t, 9.2, 18.8));
        fadeGroup(solar, windowFade(t, 27.2, 36.8));
        for (const r of rocks) fadeGroup(r.mesh, windowFade(t, 21.2, 30.8));
        for (const n of nebulae) {
          const f = windowFade(t, 26.5, 37.5);
          n.visible = f > 0.001;
          n.material.uniforms.uFade.value = f;
        }

        renderer.render(scene, camera);
      }

      window.__orbite = { renderAt, SECTIONS };
      window.addEventListener("hf-seek", (event) => renderAt(event.detail.time));

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["orbite"] = (async () => {
        renderer.compile(scene, camera);
        renderAt(window.__hfThreeTime || 0);
      })();
    
//# sourceURL=hyperframes-composition://body</script>
  </body>
</html>
